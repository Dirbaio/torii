[package]
name = "torii"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
description = "A Kubernetes Gateway API controller and proxy"

# gateway-api/ is a vendored READ-ONLY reference with its own workspace; it is NOT
# part of this package.

[[bin]]
name = "torii"
path = "src/main.rs"

[dependencies]
# Kubernetes client + controller-runtime. Pin kube and k8s-openapi together.
kube = { version = "3.1", default-features = false, features = [
    "client",
    "runtime",
    "derive",
    "rustls-tls",
] }
# Exactly ONE k8s_openapi version feature may be enabled across the whole graph,
# and it must be set by the final binary crate (this one).
k8s-openapi = { version = "0.27", default-features = false, features = ["v1_33"] }
# Gateway API CRD types (v1.5.1). Pin exactly: 0.21 has HTTPRoute (double-P) as the
# root type; nested/status types are HttpRoute*. Depends on kube 3.1 + k8s-openapi 0.27.
gateway-api = "=0.21.0"

# The data plane: tokio sockets, OpenSSL used directly, our own HTTP/1 on httparse,
# and a fork of h2 that holds no buffers on an idle connection: the `torii` branch of
# https://github.com/Dirbaio/h2 (h2 0.4.20 + the changes in its TORII.md).
openssl = "0.10"
tokio-openssl = "0.6"
httparse = "1.10"
h2 = { git = "https://github.com/Dirbaio/h2", rev = "d94c32584a49ce9ad8a4596699ba61a875933f1d" }
# TCP_NOTSENT_LOWAT, TCP keepalive and listen backlog on our sockets.
socket2 = { version = "0.6", features = ["all"] }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "io-util", "sync"] }
clap = { version = "4", features = ["derive", "env"] }
# kube's `rustls-tls` leaves the crypto backend to the app; we pick `ring` and
# install it as the process default before building any client.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
anyhow = "1"
async-trait = "0.1"
arc-swap = "1"
bytes = "1.9"
http = "1"
futures = "0.3"
regex = "1" # HTTPRoute header match type=RegularExpression
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ACME (automatic TLS cert issuance via TLS-ALPN-01). Use the `ring` crypto
# backend to match our rustls(ring) process provider and avoid pulling aws-lc-rs.
instant-acme = { version = "0.8", default-features = false, features = [
    "ring",
    "hyper-rustls",
] }
rcgen = "0.14" # validation cert (id-pe-acmeIdentifier) + issued-cert keypair/CSR
kube-leader-election = "0.43" # coordination.k8s.io Lease leader election
x509-parser = "0.16" # read cert notAfter for renewal scheduling

# Global allocator. The default glibc malloc creates up to 8*nCPU arenas and
# never returns freed memory to the OS, so a busy multi-threaded proxy ratchets
# RSS up to a per-arena high-water mark under concurrency bursts and OOMs (seen
# in prod: anon heap climbing to the cgroup limit with no code leak). jemalloc
# fragments far less and decays memory back to the OS, bounding steady-state RSS.
# Its background thread purges freed pages on its own schedule; without it, pages are
# only given back while the allocator is busy, so an idle torii kept the memory of its
# last burst of connections. It is also the process's malloc (unprefixed), so OpenSSL's
# per-connection state (~30 KB) comes back after a burst too: glibc kept ~96% of it.
# The price: ~2 KB more per TLS connection (jemalloc's size classes).
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["background_threads", "unprefixed_malloc_on_supported_platforms"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] } # paused time for the timeout tests
